<aside
    class="sidebar-aside z-40 transition-all duration-300"
    [class.sidebar-collapsed]="sidebarService.$collapsed | async"
    [class.sidebar-expanded]="(sidebarService.$collapsed | async) === false"
  >
    <div
      class="sidebar-surface flex h-full flex-col overflow-y-auto py-4 px-2"
      [class.rounded]="rounded"
      [ngClass]="extraClass"
    >
      <div class="sidebar-heading" *ngIf="(sidebarService.$collapsed | async) === false">
        <span class="sidebar-heading-label">Navegación</span>
        <span class="sidebar-heading-status"><i></i> En línea</span>
      </div>
      <ng-content></ng-content>
    </div>
  </aside>
