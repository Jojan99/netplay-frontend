<aside
    class="sidebar-aside z-40 transition-all duration-300"
    [class.sidebar-collapsed]="sidebarService.$collapsed | async"
    [class.sidebar-expanded]="(sidebarService.$collapsed | async) === false"
  >
    <div
      class="flex h-full flex-col space-y-2 overflow-y-auto bg-white/80 backdrop-blur-xl py-5 px-2 dark:bg-slate-900/80"
      [class.rounded]="rounded"
      [ngClass]="extraClass"
    >
      <ng-content></ng-content>
    </div>
  </aside>
