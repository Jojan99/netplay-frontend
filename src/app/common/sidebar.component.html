<aside
    class="sidebar-aside z-40 transition-all duration-300"
    [class.sidebar-collapsed]="sidebarService.$collapsed | async"
    [class.sidebar-expanded]="(sidebarService.$collapsed | async) === false"
  >
    <div
      class="flex h-full flex-col  space-y-4 divide-y divide-gray-200 overflow-y-auto bg-white py-4 px-3 dark:divide-gray-700 dark:border-gray-700 dark:bg-gray-800"
      [class.rounded]="rounded"
      [ngClass]="extraClass"
    >
      <ng-content></ng-content>
    </div>
  </aside>
