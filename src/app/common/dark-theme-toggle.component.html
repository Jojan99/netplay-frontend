<button type="button" class="np-icobtn" (click)="themeService.toggleTheme()" [attr.aria-label]="themeService.$theme.getValue() === 'dark' ? 'Cambiar a tema claro' : 'Cambiar a tema oscuro'" [title]="themeService.$theme.getValue() === 'dark' ? 'Tema claro' : 'Tema oscuro'">
  <svg *ngIf="themeService.$theme.getValue() === 'dark'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4m11.4-11.4 1.4-1.4"/></svg>
  <svg *ngIf="themeService.$theme.getValue() === 'light'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
</button>
