<div
    class="group flex cursor-pointer items-center rounded-xl px-3 py-2.5 text-sm font-medium text-slate-600 transition-all duration-200 hover:bg-indigo-50 hover:text-indigo-700 dark:text-slate-400 dark:hover:bg-indigo-900/20 dark:hover:text-indigo-300 mx-2 mb-0.5"
    [routerLink]="link"
    routerLinkActive="bg-indigo-50 text-indigo-700 dark:bg-indigo-900/20 dark:text-indigo-300 font-semibold shadow-sm"
    [routerLinkActiveOptions]="{ exact: true }"
    tabindex="0"
  >
    <span
      class="flex-shrink-0 transition-colors duration-200"
      [innerHTML]="icon! | sanitizeHtml"
      *ngIf="!!icon"
    ></span>
    <span
      class="flex-1 whitespace-nowrap"
      [class.ml-3]="!!icon"
      *ngIf="(sidebarService.$collapsed | async) === false"
    >
      <ng-content></ng-content>
    </span>
    <flowbite-badge
      *ngIf="(sidebarService.$collapsed | async) === false && label"
      class="bg-indigo-100 text-indigo-700 dark:bg-indigo-900/40 dark:text-indigo-300 text-[10px] font-bold px-2 py-0.5 rounded-md"
      >{{ label }}</flowbite-badge
    >
</div>
