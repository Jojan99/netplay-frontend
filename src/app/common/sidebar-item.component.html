<div
  class="sidebar-nav-item group flex cursor-pointer items-center px-3 py-2.5 text-sm mx-1 mb-0.5"
    [routerLink]="link"
  routerLinkActive="sidebar-nav-item-active"
    [routerLinkActiveOptions]="{ exact: true }"
    tabindex="0"
  >
    <span
      class="sidebar-nav-icon flex-shrink-0"
      [innerHTML]="icon! | sanitizeHtml"
      *ngIf="!!icon"
    ></span>
    <span
      class="sidebar-nav-label flex-1 whitespace-nowrap"
      [class.ml-3]="!!icon"
      *ngIf="(sidebarService.$collapsed | async) === false"
    >
      <ng-content></ng-content>
    </span>
    <flowbite-badge
      *ngIf="(sidebarService.$collapsed | async) === false && label"
      class="sidebar-nav-badge text-[10px] font-bold px-2 py-0.5 rounded-md"
      >{{ label }}</flowbite-badge
    >
</div>
