<div class="w-full space-y-2">

  <!-- USB / Manual input -->
  <div class="relative">
    <div class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-3">
      <svg class="h-4 w-4 text-gray-400" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round"
          d="M3.75 4.875c0-.621.504-1.125 1.125-1.125h4.5c.621 0 1.125.504 1.125 1.125v4.5c0 .621-.504 1.125-1.125 1.125h-4.5A1.125 1.125 0 0 1 3.75 9.375v-4.5ZM3.75 14.625c0-.621.504-1.125 1.125-1.125h4.5c.621 0 1.125.504 1.125 1.125v4.5c0 .621-.504 1.125-1.125 1.125h-4.5a1.125 1.125 0 0 1-1.125-1.125v-4.5ZM13.5 4.875c0-.621.504-1.125 1.125-1.125h4.5c.621 0 1.125.504 1.125 1.125v4.5c0 .621-.504 1.125-1.125 1.125h-4.5A1.125 1.125 0 0 1 13.5 9.375v-4.5Z" />
      </svg>
    </div>
    <input
      type="text"
      [(ngModel)]="manualInput"
      (keyup.enter)="onManualEnter()"
      [placeholder]="mode === 'serial' ? 'Pistola USB → SN, o escribe y presiona Enter' : 'Pistola USB → REF/SKU, o escribe y presiona Enter'"
      class="block w-full rounded-lg border border-gray-300 bg-white py-2 pl-10 pr-4 text-sm text-gray-900 focus:border-blue-500 focus:ring-blue-500 dark:border-gray-600 dark:bg-gray-800 dark:text-white dark:placeholder-gray-400"
    />
  </div>

  <!-- Camera button row -->
  <div class="flex gap-2">
    <button
      type="button"
      (click)="toggleCamera()"
      class="flex flex-1 items-center justify-center gap-2 rounded-lg border px-4 py-2.5 text-sm font-medium transition-colors"
      [ngClass]="(cameraActive || loading)
        ? 'border-red-300 bg-red-50 text-red-700 hover:bg-red-100 dark:border-red-700 dark:bg-red-900/30 dark:text-red-400'
        : 'border-blue-300 bg-blue-50 text-blue-700 hover:bg-blue-100 dark:border-blue-700 dark:bg-blue-900/30 dark:text-blue-400'"
    >
      <!-- spinner -->
      <svg *ngIf="loading" class="h-5 w-5 animate-spin" fill="none" viewBox="0 0 24 24">
        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 12 0 12 8h4a8 8 0 01-8 8z"/>
      </svg>
      <!-- camera icon -->
      <svg *ngIf="!cameraActive && !loading" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" d="M6.827 6.175A2.31 2.31 0 0 1 5.186 7.23c-.38.054-.757.112-1.134.175C2.999 7.58 2.25 8.507 2.25 9.574V18a2.25 2.25 0 0 0 2.25 2.25h15A2.25 2.25 0 0 0 21.75 18V9.574c0-1.067-.75-1.994-1.802-2.169a47.865 47.865 0 0 0-1.134-.175 2.31 2.31 0 0 1-1.64-1.055l-.822-1.316a2.192 2.192 0 0 0-1.736-1.039 48.774 48.774 0 0 0-5.232 0 2.192 2.192 0 0 0-1.736 1.039l-.821 1.316Z" />
        <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 12.75a4.5 4.5 0 1 1-9 0 4.5 4.5 0 0 1 9 0ZM18.75 10.5h.008v.008h-.008V10.5Z" />
      </svg>
      <!-- X icon -->
      <svg *ngIf="cameraActive && !loading" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
      </svg>

      <span *ngIf="loading">Iniciando cámara...</span>
      <span *ngIf="cameraActive && !loading">Cerrar cámara</span>
      <span *ngIf="!cameraActive && !loading">Usar cámara</span>
    </button>

    <!-- Torch button (only when camera active and torch supported) -->
    <button
      *ngIf="cameraActive && torchSupported"
      type="button"
      (click)="toggleTorch()"
      class="flex items-center justify-center rounded-lg border px-3 py-2.5 text-sm font-medium transition-colors"
      [ngClass]="torchOn
        ? 'border-yellow-400 bg-yellow-100 text-yellow-700 dark:bg-yellow-900/40 dark:text-yellow-300'
        : 'border-gray-300 bg-gray-50 text-gray-600 hover:bg-gray-100 dark:border-gray-600 dark:bg-gray-700 dark:text-gray-300'"
      title="Linterna"
    >
      <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 18v-5.25m0 0a6.01 6.01 0 0 0 1.5-.189m-1.5.189a6.01 6.01 0 0 1-1.5-.189m3.75 7.478a12.06 12.06 0 0 1-4.5 0m3.75 2.383a14.406 14.406 0 0 1-3 0M14.25 18v-.192c0-.983.658-1.823 1.508-2.316a7.5 7.5 0 1 0-7.517 0c.85.493 1.509 1.333 1.509 2.316V18" />
      </svg>
    </button>
  </div>

  <!-- Camera viewfinder -->
  <div *ngIf="cameraActive" class="scanner-wrapper">
    <video #videoEl autoplay playsinline muted class="scanner-video"></video>

    <!-- Overlay -->
    <div class="scanner-overlay">
      <div class="scanner-window" [ngClass]="mode === 'serial' ? 'window-serial' : 'window-ref'">
        <div class="corner corner-tl"></div>
        <div class="corner corner-tr"></div>
        <div class="corner corner-bl"></div>
        <div class="corner corner-br"></div>
        <div class="scanner-line" [ngClass]="mode === 'serial' ? 'line-serial' : 'line-ref'"></div>
      </div>
    </div>

    <!-- Bottom label -->
    <div class="scanner-label">
      <span>{{ modeLabel }}</span>
    </div>
  </div>

  <!-- Last detected code badge -->
  <div *ngIf="lastCode && !cameraActive"
    class="flex items-center gap-2 rounded-lg border px-3 py-2 text-xs font-medium"
    [ngClass]="{
      'border-green-300 bg-green-50 text-green-800 dark:border-green-700 dark:bg-green-900/20 dark:text-green-300': lastCode.type === 'serial',
      'border-blue-300  bg-blue-50  text-blue-800  dark:border-blue-700  dark:bg-blue-900/20  dark:text-blue-300':  lastCode.type === 'ref',
      'border-red-300   bg-red-50   text-red-800   dark:border-red-700   dark:bg-red-900/20   dark:text-red-300':   lastCode.type === 'mac'
    }"
  >
    <!-- serial icon -->
    <svg *ngIf="lastCode.type === 'serial'" class="h-4 w-4 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75 11.25 15 15 9.75M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" />
    </svg>
    <!-- ref icon -->
    <svg *ngIf="lastCode.type === 'ref'" class="h-4 w-4 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" d="M9.568 3H5.25A2.25 2.25 0 0 0 3 5.25v4.318c0 .597.237 1.17.659 1.591l9.581 9.581c.699.699 1.78.872 2.607.33a18.095 18.095 0 0 0 5.223-5.223c.542-.827.369-1.908-.33-2.607L11.16 3.66A2.25 2.25 0 0 0 9.568 3Z" />
    </svg>
    <!-- mac icon -->
    <svg *ngIf="lastCode.type === 'mac'" class="h-4 w-4 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126ZM12 15.75h.007v.008H12v-.008Z" />
    </svg>
    <span class="font-mono tracking-wide">{{ lastCode.raw }}</span>
    <span class="ml-auto text-[10px] uppercase tracking-wider opacity-70">{{ lastCode.label }}</span>
  </div>

  <!-- Error -->
  <div *ngIf="error" class="flex items-start gap-2 rounded-lg border border-red-200 bg-red-50 p-3 text-sm text-red-700 dark:border-red-800 dark:bg-red-900/20 dark:text-red-400">
    <svg class="mt-0.5 h-4 w-4 flex-shrink-0" viewBox="0 0 20 20" fill="currentColor">
      <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-8-5a.75.75 0 01.75.75v4.5a.75.75 0 01-1.5 0v-4.5A.75.75 0 0110 5zm0 10a1 1 0 100-2 1 1 0 000 2z" clip-rule="evenodd" />
    </svg>
    {{ error }}
  </div>

</div>
