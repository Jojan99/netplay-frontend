@if (lista().length) {
  <button type="button" class="nv-boton" (click)="alternar()" [class.is-abierta]="abierta()"
          [attr.aria-expanded]="abierta()"
          [title]="sinVer() ? sinVer() + ' novedad(es) sin ver' : 'Novedades de la plataforma'">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 11v2a1 1 0 0 0 1 1h2l4 3.5V6.5L6 10H4a1 1 0 0 0-1 1z"/><path d="M15 8.5a4 4 0 0 1 0 7M18 6a7 7 0 0 1 0 12"/>
    </svg>
    @if (sinVer() > 0) { <span class="nv-punto"></span> }
  </button>

  @if (abierta()) {
    <section class="nv-panel" role="dialog" aria-label="Novedades de la plataforma">
      <header class="nv-cab">
        <div><b>Novedades</b><small>Lo que se fue agregando a la plataforma</small></div>
        <button type="button" class="nv-x" (click)="abierta.set(false)" aria-label="Cerrar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
      </header>

      <div class="nv-lista">
        @for (n of lista(); track n.id) {
          <article class="nv-item" [class.is-nueva]="n.nueva">
            <div class="nv-item-t">
              <span class="nv-tipo" [attr.data-tipo]="n.tipo">{{ ETIQUETAS[n.tipo] }}</span>
              <b>{{ n.titulo }}</b>
              <span class="nv-fecha">{{ n.publicada_en | date:'d MMM' }}</span>
            </div>
            <p>{{ n.detalle }}</p>
            @if (n.ruta) { <button type="button" class="nv-ver" (click)="ir(n)">Verlo →</button> }
          </article>
        }
      </div>
    </section>
  }
}
