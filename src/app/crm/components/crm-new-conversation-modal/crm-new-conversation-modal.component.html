<div class="fixed inset-0 z-[9999] flex items-center justify-center bg-slate-900/75 backdrop-blur-sm">
  <div class="rounded-2xl shadow-2xl bg-white/95 dark:bg-slate-800/95 backdrop-blur-xl border border-slate-100 dark:border-slate-700" style="width: 380px;">

    <!-- HEADER -->
    <div class="flex items-center justify-between px-5 py-4 border-b border-slate-200/60 dark:border-slate-700/60">
      <h3 class="font-bold text-sm" style="color: #e2e8f0;">
        <i class="fa-solid fa-plus mr-2" style="color: #10b981;"></i> Nueva Conversación
      </h3>
      <button class="w-7 h-7 rounded-full flex items-center justify-center"
              style="background: #334155; color: #94a3b8;"
              (click)="closed.emit()">
        <i class="fa-solid fa-xmark text-xs"></i>
      </button>
    </div>

    <!-- FORM -->
    <div class="px-5 py-4 flex flex-col gap-4">

      <div>
        <label class="text-xs font-semibold block mb-1.5" style="color: #94a3b8;">
          Teléfono <span style="color: #ef4444;">*</span>
        </label>
        <input type="tel" [(ngModel)]="phone"
                placeholder="Ej: 573001234567"
                class="w-full px-3.5 py-2 text-sm bg-white/80 dark:bg-slate-800/80 backdrop-blur-xl border border-slate-200/60 dark:border-slate-700/60 rounded-xl text-slate-700 dark:text-slate-300 focus:ring-2 focus:ring-indigo-500/50 focus:border-indigo-400 transition-all shadow-sm outline-none" />
        <div class="mt-1 text-xs" style="color: #64748b;">Incluye código de país sin + (ej: 57 para Colombia)</div>
      </div>

      <div>
        <label class="text-xs font-semibold block mb-1.5" style="color: #94a3b8;">Nombre (opcional)</label>
        <input type="text" [(ngModel)]="name"
                placeholder="Nombre del cliente"
                class="w-full px-3.5 py-2 text-sm bg-white/80 dark:bg-slate-800/80 backdrop-blur-xl border border-slate-200/60 dark:border-slate-700/60 rounded-xl text-slate-700 dark:text-slate-300 focus:ring-2 focus:ring-indigo-500/50 focus:border-indigo-400 transition-all shadow-sm outline-none" />
      </div>

      <div *ngIf="error" class="text-xs px-3 py-2 rounded-xl" style="background: #2f0f0f; color: #f87171; border: 1px solid #ef444430;">
        {{ error }}
      </div>

    </div>

    <!-- FOOTER -->
    <div class="px-5 pb-4 flex gap-3">
      <button class="flex-1 py-2.5 rounded-xl text-sm font-medium bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 hover:bg-slate-200 transition-all"
              (click)="closed.emit()">Cancelar</button>
      <button class="flex-1 py-2.5 rounded-xl text-sm font-semibold bg-gradient-to-br from-indigo-500 to-violet-600 text-white shadow-md shadow-indigo-500/20 hover:shadow-lg transition-all flex items-center justify-center gap-2"
              [disabled]="!phone.trim() || saving"
              [style.opacity]="(!phone.trim() || saving) ? '0.5' : '1'"
              (click)="submit()">
        <div *ngIf="saving" class="w-3 h-3 border-2 border-white/40 border-t-white rounded-full animate-spin"></div>
        {{ saving ? 'Creando…' : 'Iniciar Conversación' }}
      </button>
    </div>

  </div>
</div>
