<div class="fixed inset-0 z-[9999] flex items-center justify-center"
     style="background: rgba(0,0,0,0.75); backdrop-filter: blur(4px);">
  <div class="rounded-2xl shadow-2xl" style="background: #1e293b; border: 1px solid #334155; width: 380px;">

    <!-- HEADER -->
    <div class="flex items-center justify-between px-5 py-4 border-b" style="border-color: #334155;">
      <h3 class="font-bold text-sm" style="color: #e2e8f0;">
        <i class="fa-solid fa-plus mr-2" style="color: #10b981;"></i> Nueva Conversación
      </h3>
      <button class="w-7 h-7 rounded-full flex items-center justify-center"
              style="background: #334155; color: #94a3b8;"
              (click)="closed.emit()">
        <i class="fa-solid fa-xmark text-xs"></i>
      </button>
    </div>

    <!-- FORM -->
    <div class="px-5 py-4 flex flex-col gap-4">

      <div>
        <label class="text-xs font-semibold block mb-1.5" style="color: #94a3b8;">
          Teléfono <span style="color: #ef4444;">*</span>
        </label>
        <input type="tel" [(ngModel)]="phone"
               placeholder="Ej: 573001234567"
               class="w-full px-3 py-2.5 rounded-xl text-sm outline-none"
               style="background: #0f172a; border: 1px solid #334155; color: #e2e8f0;"
               onfocus="this.style.borderColor='#10b981'"
               onblur="this.style.borderColor='#334155'" />
        <div class="mt-1 text-xs" style="color: #64748b;">Incluye código de país sin + (ej: 57 para Colombia)</div>
      </div>

      <div>
        <label class="text-xs font-semibold block mb-1.5" style="color: #94a3b8;">Nombre (opcional)</label>
        <input type="text" [(ngModel)]="name"
               placeholder="Nombre del cliente"
               class="w-full px-3 py-2.5 rounded-xl text-sm outline-none"
               style="background: #0f172a; border: 1px solid #334155; color: #e2e8f0;"
               onfocus="this.style.borderColor='#10b981'"
               onblur="this.style.borderColor='#334155'" />
      </div>

      <div *ngIf="error" class="text-xs px-3 py-2 rounded-xl" style="background: #2f0f0f; color: #f87171; border: 1px solid #ef444430;">
        {{ error }}
      </div>

    </div>

    <!-- FOOTER -->
    <div class="px-5 pb-4 flex gap-3">
      <button class="flex-1 py-2.5 rounded-xl text-sm font-medium transition"
              style="background: #334155; color: #94a3b8;"
              (click)="closed.emit()">Cancelar</button>
      <button class="flex-1 py-2.5 rounded-xl text-sm font-semibold transition flex items-center justify-center gap-2"
              style="background: #10b981; color: #000;"
              [disabled]="!phone.trim() || saving"
              [style.opacity]="(!phone.trim() || saving) ? '0.5' : '1'"
              (click)="submit()">
        <div *ngIf="saving" class="w-3 h-3 border-2 rounded-full animate-spin" style="border-color:#000; border-top-color:transparent;"></div>
        {{ saving ? 'Creando…' : 'Iniciar Conversación' }}
      </button>
    </div>

  </div>
</div>
