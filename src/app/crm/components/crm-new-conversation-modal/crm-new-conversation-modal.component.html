<div class="np-overlay" (click)="closed.emit()">
  <div class="np-modal" role="dialog" aria-modal="true" (click)="$event.stopPropagation()">
    <div class="np-modal-head"><div><p class="np-kicker">CRM <b>/</b> Chat</p><h3>Nueva conversación</h3></div><button type="button" class="np-icobtn" (click)="closed.emit()" aria-label="Cerrar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
    <div class="np-modal-body">
      <label class="np-field"><span>Teléfono <em>*</em></span><input type="tel" class="np-input np-mono" [(ngModel)]="phone" placeholder="573001234567" (keydown.enter)="submit()" /><small class="np-fine">Con código de país y sin el signo +. Colombia es 57.</small></label>
      <label class="np-field"><span>Nombre (opcional)</span><input type="text" class="np-input" [(ngModel)]="name" placeholder="Nombre del cliente" /></label>
      <p *ngIf="error" class="np-notice np-notice--danger">{{ error }}</p>
      <div class="np-btnrow np-btnrow--end"><button type="button" class="np-btn np-btn--ghost" (click)="closed.emit()">Cancelar</button><button type="button" class="np-btn np-btn--primary" [disabled]="!phone.trim() || saving" (click)="submit()">{{ saving ? 'Creando…' : 'Iniciar conversación' }}</button></div>
    </div>
  </div>
</div>
