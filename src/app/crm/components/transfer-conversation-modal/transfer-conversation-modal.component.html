<div class="np-overlay" (click)="cancel()">
  <div class="np-modal" role="dialog" aria-modal="true" (click)="$event.stopPropagation()">
    <div class="np-modal-head"><div><p class="np-kicker">CRM <b>/</b> Transferir</p><h3>Transferir conversación</h3></div><button type="button" class="np-icobtn" (click)="cancel()" aria-label="Cerrar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
    <div class="np-modal-body">
      <p class="np-sect">Agente destino</p>
      <div class="np-checklist">
        <div class="np-check np-check--agent" *ngFor="let a of agents" [class.is-selected]="a.user_id === selectedAgent?.user_id" [class.is-off]="a.status === 'saturado'" (click)="a.status !== 'saturado' && select(a)">
          <i class="wa-agent-dot" [ngClass]="'is-' + a.status"></i>
          <span class="np-strong">{{ a.name }}</span>
          <span class="np-spacer"></span>
          <button type="button" class="np-link np-link--muted" (click)="toggleExpand(a, $event)">{{ a.active_chats }}/{{ a.max_chats }} chats {{ expandedAgentId === a.user_id ? '▴' : '▾' }}</button>
          <span class="np-meter"><i [style.width.%]="(a.active_chats / a.max_chats) * 100" [style.background]="a.status === 'saturado' ? 'var(--danger)' : a.status === 'ocupado' ? 'var(--warn)' : 'var(--ok)'"></i></span>
          <div class="wa-agent-convs" *ngIf="expandedAgentId === a.user_id"><span *ngFor="let c of a.conversations" class="np-fine">#{{ c.conversation_id }} · {{ c.customer_name }}</span><span class="np-fine" *ngIf="!a.conversations?.length">Sin conversaciones activas</span></div>
        </div>
        <p class="np-muted np-check" *ngIf="agents.length === 0">No hay agentes disponibles.</p>
      </div>
      <label class="np-field"><span>Motivo (opcional)</span><textarea class="np-input np-textarea" rows="2" [(ngModel)]="reason" placeholder="Por qué se transfiere…"></textarea></label>
      <div class="np-btnrow np-btnrow--end"><button type="button" class="np-btn np-btn--ghost" (click)="cancel()">Cancelar</button><button type="button" class="np-btn np-btn--primary" [disabled]="!selectedAgent || loading" (click)="confirm()">{{ loading ? 'Transfiriendo…' : 'Transferir' }}</button></div>
    </div>
  </div>
</div>
