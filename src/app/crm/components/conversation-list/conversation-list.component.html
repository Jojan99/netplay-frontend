<div class="crm-conversation-list h-full flex flex-col min-h-0 border-r">

  <!-- HEADER -->
  <div class="crm-conversation-list-header px-4 pt-4 pb-3 border-b shrink-0">

    <!-- TITLE ROW -->
    <div class="flex items-center justify-between mb-3">
      <span class="text-sm font-bold crm-conversation-title">Conversaciones</span>
      <span class="text-xs px-2.5 py-1 rounded-full font-bold crm-conversation-count">
        {{ filtered.length }}
      </span>
    </div>

    <!-- SEARCH -->
    <div class="relative mb-3">
      <input type="search"
             [(ngModel)]="searchQuery"
             (ngModelChange)="applySearch()"
             placeholder="Buscar por nombre o teléfono…"
                  class="crm-conversation-search w-full pl-9 pr-3.5 py-2 text-sm rounded-xl transition-all shadow-sm outline-none" />
                <i class="fa-solid fa-magnifying-glass absolute left-3 top-2.5 text-xs crm-conversation-muted"></i>
    </div>

    <!-- FILTERS -->
    <div class="flex gap-1.5 flex-wrap">
      <button *ngFor="let tab of [
        {id:'new',         label:'Nuevo',      color:'#10b981', bg:'#10b98120', border:'#10b98140'},
        {id:'in_progress', label:'En curso',   color:'#60a5fa', bg:'#3b82f620', border:'#3b82f640'},
        {id:'closed',      label:'Cerrado',    color:'#f87171', bg:'#ef444420', border:'#ef444430'},
        {id:'all',         label:'Todos',      color:'#a78bfa', bg:'#8b5cf620', border:'#8b5cf640'}
      ]"
        class="px-3 py-1 rounded-xl text-xs font-semibold transition-all duration-200"
        [style.background]="activeStatus === tab.id ? tab.bg : '#f1f5f9'"
        [style.color]="activeStatus === tab.id ? tab.color : '#64748b'"
        [style.border]="'1px solid ' + (activeStatus === tab.id ? tab.border : '#dbe3e9')"
        (click)="changeStatus($any(tab.id))">
        {{ tab.label }}
      </button>
    </div>

  </div>

  <!-- LIST -->
  <div class="flex-1 min-h-0 overflow-y-auto">

    <button *ngFor="let c of filtered; trackBy: trackByConversationId"
            class="crm-conversation-row w-full text-left px-4 py-3 transition-all duration-150 border-b relative"
            [class.crm-conversation-row-active]="activeConversationId === c.id"
            (click)="selectConversation(c)">

      <div class="flex gap-3 items-start">

        <!-- AVATAR -->
        <div class="relative flex-shrink-0">
          <div class="h-10 w-10 rounded-full flex items-center justify-center font-bold text-sm bg-gradient-to-br from-teal-500 to-violet-600 text-white shadow-md shadow-teal-500/20 border border-slate-600">
            {{ getInitials(c.customer?.name || '') }}
          </div>
          <!-- Prioridad dot -->
          <span *ngIf="c.priority && c.priority !== 'normal'"
                class="absolute -top-0.5 -right-0.5 text-xs leading-none"
                [title]="c.priority">
            {{ priorityDot(c.priority) }}
          </span>
        </div>

        <!-- INFO -->
        <div class="flex-1 min-w-0">

          <!-- NAME + META -->
<div class="flex justify-between items-center gap-2">

  <span
    class="font-semibold text-sm truncate crm-conversation-customer-name"
    [class.crm-conversation-title-active]="activeConversationId === c.id">
    {{ c.customer?.name || 'Cliente' }}
  </span>

  <div class="flex items-center gap-1.5 flex-shrink-0">

    <!-- UNREAD BADGE -->
    <span
      *ngIf="c.unread_count && activeConversationId !== c.id"
      class="text-xs font-bold rounded-full min-w-[18px] h-[18px] px-1 flex items-center justify-center bg-teal-500 text-white">
      {{ c.unread_count }}
    </span>

    <!-- HORA -->
    <span
      *ngIf="c.last_message?.at"
      class="text-xs flex-shrink-0 crm-conversation-muted">
      {{ c.last_message.at | date:'HH:mm' }}
    </span>

  </div>
</div>
          <!-- LAST MESSAGE -->
          <div class="flex items-center gap-1.5 text-xs truncate mt-0.5 crm-conversation-muted">
            <span class="truncate">{{ lastMessagePreview(c.last_message) }}</span>
          </div>

          <!-- FOOTER: status + agente -->
          <div class="flex items-center gap-2 mt-1 flex-wrap">
            <span class="crm-conversation-status text-xs font-medium px-1.5 py-0.5 rounded-md"
              [class.crm-status-new]="c.status === 'new'"
              [class.crm-status-progress]="c.status === 'in_progress'"
              [class.crm-status-closed]="c.status !== 'new' && c.status !== 'in_progress'">
              {{ getStatusLabel(c.status) }}
            </span>

            <span *ngIf="c.assigned_user"
                  class="text-xs truncate max-w-[80px] crm-conversation-muted">
              <i class="fa-solid fa-user text-xs mr-0.5"></i>
              {{ c.assigned_user.names }}
            </span>
          </div>

        </div>
      </div>
    </button>

    <!-- EMPTY STATE -->
    <div *ngIf="!filtered || filtered.length === 0"
         class="flex flex-col items-center justify-center py-16 gap-3">
      <div class="text-4xl opacity-20">💬</div>
      <div class="text-sm font-medium text-slate-600">Sin conversaciones</div>
      <div class="text-xs text-slate-700">
        {{ searchQuery ? 'Sin resultados para "' + searchQuery + '"' : 'Intenta cambiar el filtro' }}
      </div>
    </div>

  </div>

</div>
