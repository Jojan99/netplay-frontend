<div class="wa-viewer" (click)="close.emit()" (keydown.escape)="close.emit()" tabindex="-1">
  <div class="wa-viewer-bar" (click)="$event.stopPropagation()">
    <span class="wa-viewer-title"><b>{{ type === 'pdf' ? 'Documento PDF' : type === 'office' ? 'Documento de Office' : 'Imagen' }}</b><small class="np-mono">{{ fileLabel }}</small></span>
    <span class="np-spacer"></span>
    <a class="wa-viewer-btn" [href]="url" target="_blank" rel="noopener" title="Abrir en pestaña nueva"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 4h6v6M20 4l-9 9M19 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h5"/></svg></a>
    <button type="button" class="wa-viewer-btn" (click)="download()" title="Descargar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 4v11m0 0 4-4m-4 4-4-4M5 20h14"/></svg></button>
    <button type="button" class="wa-viewer-btn" (click)="close.emit()" title="Cerrar" aria-label="Cerrar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
  </div>
  <div class="wa-viewer-body" (click)="$event.stopPropagation()">
    <iframe *ngIf="type === 'pdf'" [src]="safeUrl" title="Documento PDF"></iframe>
    <iframe *ngIf="type === 'office'" [src]="safeOfficeUrl" title="Documento"></iframe>
    <img *ngIf="type === 'image'" [src]="url" alt="Imagen" />
  </div>
</div>
