<div class="fixed inset-0 z-50 bg-slate-900/80 backdrop-blur-sm flex items-center justify-center">

  <!-- Cerrar -->
  <button
    class="absolute top-4 right-4 text-white text-2xl"
    (click)="close.emit()">
    ✕
  </button>

  <!-- CONTENIDO -->
  <div class="w-[95vw] h-[95vh] bg-white/95 backdrop-blur-xl rounded-2xl border border-slate-100 overflow-hidden">

    <!-- PDF -->
    <iframe
      *ngIf="type === 'pdf'"
      [src]="safeUrl"
      class="w-full h-full">
    </iframe>

    <!-- OFFICE -->
    <iframe
      *ngIf="type === 'office'"
      [src]="safeOfficeUrl"
      class="w-full h-full">
    </iframe>

    <!-- IMAGEN -->
    <img
      *ngIf="type === 'image'"
      [src]="url"
      class="w-full h-full object-contain bg-black">
  </div>

</div>
