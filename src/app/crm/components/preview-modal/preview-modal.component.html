<div class="crm-preview-backdrop fixed inset-0 z-50 flex items-center justify-center p-4">

  <div class="crm-preview-panel w-[95vw] h-[95vh] backdrop-blur-xl rounded-2xl overflow-hidden">

    <div class="crm-preview-toolbar flex items-center justify-between px-4 py-3">
      <div class="flex items-center gap-3 min-w-0">
        <span class="crm-preview-file-icon flex items-center justify-center rounded-lg">
          <i class="fa-solid" [ngClass]="type === 'pdf' ? 'fa-file-pdf' : type === 'office' ? 'fa-file-word' : 'fa-file-image'"></i>
        </span>
        <div class="min-w-0">
          <div class="crm-preview-title truncate">{{ type === 'pdf' ? 'Vista previa del PDF' : type === 'office' ? 'Vista previa del documento' : 'Vista previa de imagen' }}</div>
          <div class="crm-preview-subtitle">Archivo adjunto</div>
        </div>
      </div>

      <div class="flex items-center gap-2 flex-shrink-0">
        <button *ngIf="type === 'pdf' || type === 'office'"
                type="button"
                class="crm-preview-download inline-flex items-center gap-2 rounded-lg px-3 py-2 text-xs font-bold"
                title="Descargar archivo"
                (click)="download()">
          <i class="fa-solid fa-download"></i>
          <span>Descargar</span>
        </button>
        <button type="button"
                class="crm-preview-close flex items-center justify-center rounded-lg"
                title="Cerrar vista previa"
                aria-label="Cerrar vista previa"
                (click)="close.emit()">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>
    </div>

    <div class="crm-preview-content">
      <!-- PDF -->
      <iframe
        *ngIf="type === 'pdf'"
        [src]="safeUrl"
        class="crm-preview-frame"
        title="Vista previa del PDF">
      </iframe>

      <!-- OFFICE -->
      <iframe
        *ngIf="type === 'office'"
        [src]="safeOfficeUrl"
        class="crm-preview-frame"
        title="Vista previa del documento">
      </iframe>

      <!-- IMAGEN -->
      <img
        *ngIf="type === 'image'"
        [src]="url"
        class="crm-preview-image"
        alt="Vista previa del archivo">
    </div>
  </div>

</div>
