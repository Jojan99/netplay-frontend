<div class="np-overlay" (click)="closed.emit()">
  <div class="np-modal np-modal--editor" role="dialog" aria-modal="true" (click)="$event.stopPropagation()">
    <div class="np-modal-head"><div><p class="np-kicker">CRM <b>/</b> Difusión</p><h3>Mensaje masivo</h3></div><button type="button" class="np-icobtn" (click)="closed.emit()" aria-label="Cerrar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
    <div class="np-modal-body" *ngIf="sent">
      <div class="np-stats"><div class="np-stat"><span class="np-stat-l">Enviados</span><span class="np-stat-v" style="color:var(--ok)">{{ result?.sent }}</span></div><div class="np-stat"><span class="np-stat-l">Fallidos</span><span class="np-stat-v" [class.is-warn]="result?.failed">{{ result?.failed }}</span></div></div>
      <div class="np-btnrow np-btnrow--end"><button type="button" class="np-btn np-btn--primary" (click)="closed.emit()">Cerrar</button></div>
    </div>
    <div class="np-modal-body np-modal-body--scroll" *ngIf="!sent">
      <label class="np-field"><span>Mensaje</span><textarea class="np-input np-textarea" rows="4" [(ngModel)]="message" placeholder="Lo reciben todos los clientes seleccionados…"></textarea><small class="np-fine np-mono">{{ message.length }} caracteres</small></label>
      <div class="np-subbar"><p class="np-sect np-sect--inline">Destinatarios · {{ selected.size }} seleccionados</p><span class="np-spacer"></span><button type="button" class="np-link" (click)="toggleAll()">{{ allSelected ? 'Deseleccionar todos' : 'Seleccionar todos' }}</button></div>
      <label class="np-search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg><input type="search" [(ngModel)]="search" (ngModelChange)="filterCustomers()" placeholder="Buscar cliente…" /></label>
      <div class="np-chips" role="group" aria-label="Filtro"><button type="button" class="np-chip" *ngFor="let f of quickFilters" [attr.aria-pressed]="quickFilter === f.id" (click)="setQuickFilter(f.id)">{{ f.label }}</button></div>
      <div class="np-checklist wa-bc-list">
        <label class="np-check" *ngFor="let c of filtered"><input type="checkbox" [checked]="selected.has(c.id)" (change)="toggle(c.id)" /><span class="wa-bc-copy"><b>{{ c.name || c.phone }}</b><small><span class="np-mono" *ngIf="c.name">{{ c.phone }}</span><ng-container *ngIf="c.plan"> · {{ c.plan }}</ng-container><ng-container *ngIf="c.status"> · {{ c.status }}</ng-container><ng-container *ngIf="!c.linked"> · sin vincular</ng-container></small></span></label>
        <p class="np-muted np-check" *ngIf="filtered.length === 0">Sin resultados.</p>
      </div>
      <p class="np-fine">{{ filtered.length }} en la lista · {{ selected.size }} seleccionados · el envío respeta la línea de prueba y el límite del servicio.</p>
      <div class="np-btnrow np-btnrow--end"><button type="button" class="np-btn np-btn--ghost" (click)="closed.emit()">Cancelar</button><button type="button" class="np-btn np-btn--primary" [disabled]="!message.trim() || !selected.size || sending" (click)="submit()"><span *ngIf="sending" class="np-spinner np-spinner--sm"></span>{{ sending ? 'Enviando…' : 'Enviar a ' + selected.size }}</button></div>
    </div>
  </div>
</div>
