<div class="fixed inset-0 z-[9999] flex items-center justify-center bg-slate-900/75 backdrop-blur-sm">
  <div class="rounded-2xl shadow-2xl flex flex-col bg-white/95 dark:bg-slate-800/95 backdrop-blur-xl border border-slate-100 dark:border-slate-700" style="width: 480px; max-height: 85vh;">

    <!-- HEADER -->
    <div class="flex items-center justify-between px-5 py-4 border-b shrink-0 border-slate-200/60 dark:border-slate-700/60">
      <h3 class="font-bold text-sm" style="color: #e2e8f0;">
        <i class="fa-solid fa-bullhorn mr-2" style="color: #10b981;"></i> Mensaje Masivo
      </h3>
      <button class="w-7 h-7 rounded-full flex items-center justify-center"
              style="background: #334155; color: #94a3b8;"
              (click)="closed.emit()">
        <i class="fa-solid fa-xmark text-xs"></i>
      </button>
    </div>

    <!-- RESULTADO -->
    <div *ngIf="sent" class="flex flex-col items-center justify-center py-12 gap-4">
      <div class="text-5xl">📤</div>
      <div class="text-lg font-bold" style="color: #10b981;">¡Enviado!</div>
      <div class="text-sm" style="color: #94a3b8;">
        <span style="color: #10b981; font-weight: 600;">{{ result?.sent }}</span> enviados,
        <span [style.color]="result?.failed ? '#ef4444' : '#64748b'" class="font-medium">{{ result?.failed }}</span> fallidos
      </div>
      <button class="px-6 py-2 rounded-xl text-sm font-semibold bg-gradient-to-br from-indigo-500 to-violet-600 text-white shadow-md shadow-indigo-500/20 hover:shadow-lg transition-all" (click)="closed.emit()">
        Cerrar
      </button>
    </div>

    <ng-container *ngIf="!sent">

      <!-- MENSAJE -->
      <div class="px-5 py-4 border-b shrink-0 border-slate-200/60 dark:border-slate-700/60">
        <label class="text-xs font-semibold uppercase tracking-wide block mb-2" style="color: #64748b;">
          Mensaje a enviar
        </label>
        <textarea [(ngModel)]="message"
                  placeholder="Escribe el mensaje que recibirán todos los clientes seleccionados…"
                  rows="4"
                   class="w-full px-3.5 py-2 text-sm bg-white/80 dark:bg-slate-800/80 backdrop-blur-xl border border-slate-200/60 dark:border-slate-700/60 rounded-xl text-slate-700 dark:text-slate-300 focus:ring-2 focus:ring-indigo-500/50 focus:border-indigo-400 transition-all shadow-sm outline-none resize-none"
                   style="line-height: 1.6;">
        </textarea>
        <div class="mt-1 text-xs text-right" style="color: #475569;">{{ message.length }} caracteres</div>
      </div>

      <!-- BÚSQUEDA Y LISTA -->
      <div class="px-5 py-3 border-b shrink-0 border-slate-200/60 dark:border-slate-700/60">
        <div class="flex items-center justify-between mb-2">
          <label class="text-xs font-semibold uppercase tracking-wide" style="color: #64748b;">
            Destinatarios ({{ selected.size }} seleccionados)
          </label>
          <button class="text-xs font-medium transition"
                  [style.color]="allSelected ? '#ef4444' : '#10b981'"
                  (click)="toggleAll()">
            {{ allSelected ? 'Deseleccionar todos' : 'Seleccionar todos' }}
          </button>
        </div>
        <div class="relative">
          <input type="search" [(ngModel)]="search" (ngModelChange)="filterCustomers()"
                  placeholder="Buscar cliente…"
                  class="w-full pl-9 pr-3 py-2 text-xs bg-white/80 dark:bg-slate-800/80 backdrop-blur-xl border border-slate-200/60 dark:border-slate-700/60 rounded-xl text-slate-700 dark:text-slate-300 focus:ring-2 focus:ring-indigo-500/50 focus:border-indigo-400 transition-all shadow-sm outline-none" />
          <i class="fa-solid fa-magnifying-glass absolute left-3 top-2.5 text-xs" style="color: #64748b;"></i>
        </div>
      </div>

      <!-- LISTA CLIENTES -->
      <div class="flex-1 overflow-y-auto px-5 py-2">
        <button *ngFor="let c of filtered"
                class="flex items-center gap-3 w-full px-3 py-2.5 rounded-xl mb-1 transition text-left"
                [style.background]="selected.has(c.id) ? '#10b98115' : 'transparent'"
                [style.border]="'1px solid ' + (selected.has(c.id) ? '#10b98140' : 'transparent')"
                onmouseenter="if(!this.style.border.includes('10b981')) this.style.background='#0f172a'"
                onmouseleave="if(!this.style.border.includes('10b981')) this.style.background='transparent'"
                (click)="toggle(c.id)">
          <div class="w-8 h-8 rounded-full flex items-center justify-center font-bold text-xs flex-shrink-0"
               style="background: #1e3a5f; color: #10b981;">
            {{ c.name?.charAt(0)?.toUpperCase() || '?' }}
          </div>
          <div class="flex-1 min-w-0">
            <div class="text-sm font-medium truncate" style="color: #e2e8f0;">{{ c.name }}</div>
            <div class="text-xs" style="color: #64748b;">{{ c.phone }}</div>
          </div>
          <div class="w-5 h-5 rounded-full border-2 flex items-center justify-center flex-shrink-0 transition"
               [style.borderColor]="selected.has(c.id) ? '#10b981' : '#334155'"
               [style.background]="selected.has(c.id) ? '#10b981' : 'transparent'">
            <i *ngIf="selected.has(c.id)" class="fa-solid fa-check text-xs" style="color: #000;"></i>
          </div>
        </button>

        <div *ngIf="filtered.length === 0" class="text-xs text-center py-8" style="color: #475569;">
          Sin resultados
        </div>
      </div>

      <!-- FOOTER -->
      <div class="px-5 py-4 border-t flex gap-3 shrink-0 border-slate-200/60 dark:border-slate-700/60">
        <button class="flex-1 py-2.5 rounded-xl text-sm font-medium bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 hover:bg-slate-200 transition-all"
                (click)="closed.emit()">Cancelar</button>
        <button class="flex-1 py-2.5 rounded-xl text-sm font-semibold bg-gradient-to-br from-indigo-500 to-violet-600 text-white shadow-md shadow-indigo-500/20 hover:shadow-lg transition-all flex items-center justify-center gap-2"
                [disabled]="!message.trim() || !selected.size || sending"
                [style.opacity]="(!message.trim() || !selected.size || sending) ? '0.5' : '1'"
                (click)="submit()">
          <i *ngIf="!sending" class="fa-solid fa-paper-plane text-xs"></i>
          <div *ngIf="sending" class="w-3 h-3 border-2 border-white/40 border-t-white rounded-full animate-spin"></div>
          {{ sending ? 'Enviando…' : 'Enviar a ' + selected.size }}
        </button>
      </div>

    </ng-container>
  </div>
</div>
