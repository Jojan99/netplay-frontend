<div class="shrink-0 flex items-center px-4 py-3 border-b"
     style="background: #1e293b; border-color: #334155;">

  <!-- IZQUIERDA -->
  <div class="flex items-center gap-3 min-w-0">

    <!-- BACK MOBILE -->
    <button class="md:hidden w-8 h-8 flex items-center justify-center rounded-full transition flex-shrink-0"
            style="background: #334155; color: #94a3b8;"
            (click)="back.emit()">
      <i class="fa-solid fa-arrow-left text-xs"></i>
    </button>

    <!-- AVATAR -->
    <div class="relative flex-shrink-0">
      <div class="h-10 w-10 rounded-full flex items-center justify-center font-bold text-sm"
           style="background: linear-gradient(135deg, #1e3a5f 0%, #0f2f1f 100%); color: #10b981; border: 1.5px solid #334155;">
        {{ initials }}
      </div>
      <span class="absolute bottom-0 right-0 h-2.5 w-2.5 rounded-full border-2"
            style="background: #10b981; border-color: #1e293b;"></span>
    </div>

    <!-- INFO -->
    <div class="min-w-0 leading-tight">
      <h4 class="font-semibold truncate text-sm" style="color: #e2e8f0;">
        {{ data.customerName }}
      </h4>
      <div class="flex items-center gap-2 text-xs" style="color: #64748b;">
        <span style="color: #10b981;" class="font-medium">● En línea</span>
        <span style="color: #334155;">•</span>
        <span>{{ priorityLabel }}</span>
        <ng-container *ngIf="data.agentName">
          <span style="color: #334155;">•</span>
          <span class="truncate max-w-[100px]" style="color: #60a5fa;">
            <i class="fa-solid fa-user text-xs mr-0.5"></i>{{ data.agentName }}
          </span>
        </ng-container>
      </div>
    </div>

  </div>

  <!-- DERECHA -->
  <div class="ml-auto flex items-center gap-2 flex-shrink-0">

    <!-- STATUS BADGE -->
    <span class="text-xs px-3 py-1 rounded-full font-semibold" [style]="statusStyle">
      {{ statusLabel }}
    </span>

    <!-- INFO PANEL TOGGLE -->
    <button class="w-8 h-8 flex items-center justify-center rounded-full transition"
            style="background: #334155; color: #94a3b8;"
            title="Información del cliente"
            onmouseenter="this.style.background='#475569'; this.style.color='#e2e8f0'"
            onmouseleave="this.style.background='#334155'; this.style.color='#94a3b8'"
            (click)="toggleInfo.emit()">
      <i class="fa-solid fa-circle-info text-sm"></i>
    </button>

    <!-- TRANSFERIR -->
    <button class="px-3 py-1.5 text-xs rounded-xl font-medium transition flex items-center gap-1.5"
            style="background: #334155; color: #94a3b8; border: 1px solid #475569;"
            onmouseenter="this.style.background='#475569'; this.style.color='#e2e8f0'"
            onmouseleave="this.style.background='#334155'; this.style.color='#94a3b8'"
            (click)="openTransfer.emit()">
      <i class="fa-solid fa-arrow-right-arrow-left text-xs"></i>
      Transferir
    </button>

    <!-- FINALIZAR -->
    <button *ngIf="data.status !== 'closed'"
            class="px-3 py-1.5 text-xs rounded-xl font-semibold transition flex items-center gap-1.5"
            style="background: #2f0f0f; color: #ef4444; border: 1px solid #ef444430;"
            onmouseenter="this.style.background='#ef444415'; this.style.borderColor='#ef4444'"
            onmouseleave="this.style.background='#2f0f0f'; this.style.borderColor='#ef444430'"
            (click)="finish.emit()">
      <i class="fa-solid fa-xmark text-xs"></i>
      Finalizar
    </button>

  </div>

</div>
