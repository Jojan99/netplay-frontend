<div class="wa-chat-head">
  <button type="button" class="wa-ibtn wa-back" (click)="back.emit()" aria-label="Volver a los chats"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 6-6 6 6 6"/></svg></button>
  <button type="button" class="wa-head-id" (click)="toggleInfo.emit()" title="Ver información del contacto">
    <span class="wa-avatar">{{ initials }}</span>
    <span class="wa-head-copy">
      <span class="wa-head-name">{{ data.customerName }}</span>
      <span class="wa-head-sub"><span class="np-mono">{{ data.customerPhone }}</span><ng-container *ngIf="data.agentName"> · atiende {{ data.agentName }}</ng-container><ng-container *ngIf="data.priority === 'high'"> · <b class="wa-prio-txt">prioridad alta</b></ng-container></span>
    </span>
  </button>
  <span class="np-spacer"></span>
  <span class="wa-status" [ngClass]="'wa-status--' + data.status">{{ statusLabel }}</span>
  <button type="button" class="wa-pill" [class.is-on]="botPaused" (click)="toggleBot.emit()" [title]="botPaused ? 'El bot está pausado en este chat' : 'Pausar el bot en este chat'">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="7" width="16" height="12" rx="3"/><path d="M12 3v4M8 13h.01M16 13h.01M9 17h6"/></svg>{{ botPaused ? 'Reanudar bot' : 'Pausar bot' }}
  </button>
  <button type="button" class="wa-ibtn" (click)="search.emit()" title="Buscar en la conversación"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></button>
  <button type="button" class="wa-ibtn" (click)="openTransfer.emit()" title="Transferir a otro agente"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 8h13m0 0-4-4m4 4-4 4M20 16H7m0 0 4 4m-4-4 4-4"/></svg></button>
  <button type="button" class="wa-ibtn" (click)="toggleInfo.emit()" title="Información del contacto"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg></button>
  <button type="button" class="wa-ibtn wa-ibtn--danger" *ngIf="data.status !== 'closed'" (click)="finish.emit()" title="Finalizar conversación"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="m8.5 12.5 2.5 2.5 4.5-5"/></svg></button>
</div>
