<!-- ROOT -->
<div class="crm-mobile-root crm-inbox-shell h-screen flex flex-col">

  <!-- ══════════════════════ TOP NAV BAR ══════════════════════ -->
  <div class="crm-inbox-topbar shrink-0 flex items-center gap-3 px-4 py-2.5 border-b backdrop-blur-xl">

    <!-- LOGO / TÍTULO -->
    <div class="flex items-center gap-2 mr-2">
      <div class="w-7 h-7 rounded-lg flex items-center justify-center bg-gradient-to-br from-teal-500 to-emerald-600 shadow-md shadow-teal-500/20">
        <i class="fa-brands fa-whatsapp text-white w-5 h-5 flex items-center justify-center text-sm"></i>
      </div>
      <span class="text-sm font-bold text-slate-200">Bandeja CRM</span>
    </div>

    <!-- VIEWS -->
    <div class="flex gap-1">
      <button class="px-3 py-1.5 rounded-xl text-xs font-semibold transition flex items-center gap-1.5"
              [style.background]="mainView === 'inbox' ? '#10b98120' : 'transparent'"
              [style.color]="mainView === 'inbox' ? '#10b981' : '#64748b'"
              [style.border]="mainView === 'inbox' ? '1px solid #10b98140' : '1px solid transparent'"
              (click)="setView('inbox')">
        <i class="fa-solid fa-inbox text-xs"></i> Inbox
      </button>

      <button class="px-3 py-1.5 rounded-xl text-xs font-semibold transition flex items-center gap-1.5"
              [style.background]="mainView === 'dashboard' ? '#3b82f620' : 'transparent'"
              [style.color]="mainView === 'dashboard' ? '#60a5fa' : '#64748b'"
              [style.border]="mainView === 'dashboard' ? '1px solid #3b82f640' : '1px solid transparent'"
              (click)="setView('dashboard')">
        <i class="fa-solid fa-chart-line text-xs"></i> Dashboard
      </button>
    </div>

    <div class="crm-provider-tabs">
      <button type="button" [class.active]="inboxProvider === 'meta'" (click)="setProvider('meta')"><i class="fa-brands fa-whatsapp"></i> Meta API</button>
      <button type="button" [class.active]="inboxProvider === 'netplay'" (click)="setProvider('netplay')"><i class="fa-solid fa-mobile-screen-button"></i> Netplay WhatsApp</button>
    </div>

    <!-- SPACER -->
    <div class="flex-1"></div>

    <!-- ACCIONES -->
    <div class="flex items-center gap-2">

      <!-- RECARGAR -->
      <button class="w-8 h-8 flex items-center justify-center rounded-full transition bg-slate-700 text-slate-400 hover:bg-slate-600"
              title="Recargar inbox"
              (click)="loadInbox()">
        <i class="fa-solid fa-rotate-right text-sm"></i>
      </button>

      <!-- NUEVA CONVERSACIÓN -->
      <button class="w-8 h-8 flex items-center justify-center rounded-full transition bg-gradient-to-br from-teal-500 to-emerald-600 text-white shadow-md shadow-teal-500/20 hover:shadow-lg"
              title="Nueva conversación"
              (click)="showNewConversationModal = true">
        <i class="fa-solid fa-plus text-sm"></i>
      </button>

      <!-- BROADCAST -->
      <button class="px-3 py-1.5 rounded-xl text-xs font-semibold transition flex items-center gap-1.5 bg-slate-700 text-slate-400 border border-slate-600 hover:bg-slate-600 hover:text-slate-200"
              onmouseenter="this.style.background='#475569'; this.style.color='#e2e8f0'"
              onmouseleave="this.style.background='#334155'; this.style.color='#94a3b8'"
              title="Mensaje masivo"
              (click)="showBroadcastModal = true">
        <i class="fa-solid fa-bullhorn text-xs"></i>
        <span class="hidden sm:inline">Broadcast</span>
      </button>

    </div>
  </div>

  <!-- ══════════════════════ MAIN CONTENT ══════════════════════ -->
  <div class="flex-1 min-h-0 overflow-hidden">

    <!-- DASHBOARD VIEW -->
    <ng-container *ngIf="mainView === 'dashboard'">
      <app-crm-dashboard class="block h-full"></app-crm-dashboard>
    </ng-container>

    <!-- INBOX VIEW -->
    <ng-container *ngIf="mainView === 'inbox'">
      <div class="h-full flex overflow-hidden min-h-0 relative">

        <!-- 📋 LISTA DE CONVERSACIONES -->
        <div class="absolute md:relative inset-0 md:inset-auto
                    w-full md:w-96
                    h-full min-h-0
                    transition-all duration-400 ease-in-out
                    will-change-transform will-change-opacity"
             [class.translate-x-0]="mobileView === 'list' || !isMobile"
             [class.-translate-x-full]="mobileView === 'chat' && isMobile"
             [class.opacity-100]="mobileView === 'list' || !isMobile"
             [class.opacity-0]="mobileView === 'chat' && isMobile"
             [class.pointer-events-none]="mobileView === 'chat' && isMobile">
          <app-conversation-list
            [conversations]="inbox"
            [activeConversationId]="activeConversationId"
            [activeStatus]="inboxStatus"
            (openChat)="openChat($event)"
            (statusChange)="setStatus($event)">
          </app-conversation-list>
        </div>

        <!-- 💬 CHAT -->
        <div class="crm-inbox-chat-pane absolute md:relative inset-0 md:inset-auto
              flex-1 min-w-0
                    h-full min-h-0
                    transition-all duration-400 ease-in-out
                    will-change-transform will-change-opacity"
             [class.translate-x-full]="mobileView === 'list' && isMobile"
             [class.translate-x-0]="mobileView === 'chat' || !isMobile"
             [class.opacity-0]="mobileView === 'list' && isMobile"
             [class.opacity-100]="mobileView === 'chat' || !isMobile"
             [class.pointer-events-none]="mobileView === 'list' && isMobile"
             >
          <app-chat-window
            class="h-full block"
            [conversationId]="activeConversationId"
            (conversationClosed)="onConversationClosed()"
            (openTransfer)="openTransfer()"
            (back)="backToList()">
          </app-chat-window>
        </div>

        <!-- 🔁 MODAL TRANSFERIR -->
        <app-transfer-conversation-modal
          *ngIf="showTransferModal"
          [conversationId]="activeConversationId!"
          (closed)="onTransferClosed($event)">
        </app-transfer-conversation-modal>

      </div>
    </ng-container>

  </div>

</div>

<!-- ══════════════════════ MODALES GLOBALES ══════════════════════ -->

<!-- BROADCAST -->
<app-crm-broadcast-modal
  *ngIf="showBroadcastModal"
  (closed)="showBroadcastModal = false">
</app-crm-broadcast-modal>

<!-- NUEVA CONVERSACIÓN -->
<app-crm-new-conversation-modal
  *ngIf="showNewConversationModal"
  (closed)="showNewConversationModal = false"
  (created)="onConversationCreated($event); showNewConversationModal = false">
</app-crm-new-conversation-modal>
