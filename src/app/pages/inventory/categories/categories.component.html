<div class="max-w-8xl mx-auto mt-4 sm:mt-8 rounded-lg shadow p-3 sm:p-6">
  <div class="w-full mb-1">

    <!-- Breadcrumb -->
    <div class="mb-4">
      <nav class="flex mb-5" aria-label="Breadcrumb">
        <ol class="inline-flex items-center space-x-1 text-sm font-medium md:space-x-2">
          <li class="inline-flex items-center">
            <a class="inline-flex items-center text-gray-700 hover:text-primary-600 dark:text-gray-300 dark:hover:text-white">
              <svg class="w-5 h-5 mr-2.5" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
                <path d="M10.707 2.293a1 1 0 00-1.414 0l-7 7a1 1 0 001.414 1.414L4 10.414V17a1 1 0 001 1h2a1 1 0 001-1v-2a1 1 0 011-1h2a1 1 0 011 1v2a1 1 0 001 1h2a1 1 0 001-1v-6.586l.293.293a1 1 0 001.414-1.414l-7-7z"></path>
              </svg>
              Home
            </a>
          </li>
          <li>
            <div class="flex items-center">
              <svg class="w-6 h-6 text-gray-400" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M7.293 14.707a1 1 0 010-1.414L10.586 10 7.293 6.707a1 1 0 011.414-1.414l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414 0z" clip-rule="evenodd"></path></svg>
              <a [routerLink]="['/dashboard/inventory']" class="ml-1 text-gray-700 hover:text-primary-600 md:ml-2 dark:text-gray-300 dark:hover:text-white cursor-pointer">Inventario</a>
            </div>
          </li>
          <li>
            <div class="flex items-center">
              <svg class="w-6 h-6 text-gray-400" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M7.293 14.707a1 1 0 010-1.414L10.586 10 7.293 6.707a1 1 0 011.414-1.414l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414 0z" clip-rule="evenodd"></path></svg>
              <span class="ml-1 text-gray-400 md:ml-2 dark:text-gray-500" aria-current="page">Categorías</span>
            </div>
          </li>
        </ol>
      </nav>
      <div class="flex flex-wrap items-center justify-between gap-3">
        <h1 class="text-lg sm:text-2xl font-semibold text-gray-900 dark:text-white">CATEGORÍAS DE INVENTARIO</h1>
        <button (click)="toggleForm()"
          class="flex items-center px-4 py-2 text-sm font-medium text-white bg-blue-700 rounded-lg hover:bg-blue-800 focus:ring-4 focus:ring-blue-300 dark:bg-blue-600 dark:hover:bg-blue-700">
          <svg class="w-4 h-4 mr-2" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
          </svg>
          {{ showForm ? 'Cancelar' : 'Nueva Categoría' }}
        </button>
      </div>
    </div>

    <!-- Inline form -->
    <div *ngIf="showForm" class="p-5 mb-6 bg-white border border-gray-200 rounded-lg dark:bg-gray-800 dark:border-gray-700">
      <h3 class="text-base font-semibold text-gray-900 dark:text-white mb-4">Nueva Categoría</h3>
      <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
        <div>
          <label class="block mb-1 text-sm font-medium text-gray-700 dark:text-gray-300">Nombre *</label>
          <input type="text" [(ngModel)]="newCategory.name"
            class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:text-white"
            placeholder="Nombre de la categoría" />
        </div>
        <div>
          <label class="block mb-1 text-sm font-medium text-gray-700 dark:text-gray-300">Descripción</label>
          <input type="text" [(ngModel)]="newCategory.description"
            class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:text-white"
            placeholder="Descripción opcional" />
        </div>
      </div>
      <div class="flex justify-end mt-4">
        <button (click)="saveCategory()"
          class="px-4 py-2 text-sm font-medium text-white bg-blue-700 rounded-lg hover:bg-blue-800 focus:ring-4 focus:ring-blue-300 dark:bg-blue-600 dark:hover:bg-blue-700">
          Crear Categoría
        </button>
      </div>
    </div>

    <!-- Table -->
    <div class="flex flex-col mt-4">
      <div class="overflow-x-auto rounded-lg">
        <div class="inline-block min-w-full align-middle">
          <div class="overflow-hidden shadow sm:rounded-lg">

            <table *ngIf="!skeletor; else skeletonTable" class="min-w-full divide-y divide-gray-200 dark:divide-gray-600">
              <thead class="bg-gray-50 dark:bg-gray-700">
                <tr>
                  <th class="p-4 text-xs font-medium text-left text-gray-500 uppercase dark:text-gray-400">#</th>
                  <th class="p-4 text-xs font-medium text-left text-gray-500 uppercase dark:text-gray-400">Nombre</th>
                  <th class="p-4 text-xs font-medium text-left text-gray-500 uppercase dark:text-gray-400">Descripción</th>
                  <th class="p-4 text-xs font-medium text-left text-gray-500 uppercase dark:text-gray-400">Fecha creación</th>
                </tr>
              </thead>
              <tbody class="bg-white divide-y divide-gray-200 dark:bg-gray-800 dark:divide-gray-700">
                <tr *ngFor="let cat of categories; let i = index" class="hover:bg-gray-100 dark:hover:bg-gray-700">
                  <td class="p-4 text-sm text-gray-500 whitespace-nowrap dark:text-gray-400">{{ i + 1 }}</td>
                  <td class="p-4 text-sm font-medium text-gray-900 whitespace-nowrap dark:text-white">{{ cat.name }}</td>
                  <td class="p-4 text-sm text-gray-500 dark:text-gray-400">{{ cat.description || '-' }}</td>
                  <td class="p-4 text-sm text-gray-500 whitespace-nowrap dark:text-gray-400">
                    {{ cat.created_at | date:'dd/MM/yyyy' }}
                  </td>
                </tr>
                <tr *ngIf="categories.length === 0">
                  <td colspan="4" class="p-6 text-sm text-center text-gray-500 dark:text-gray-400">
                    No hay categorías registradas.
                  </td>
                </tr>
              </tbody>
            </table>

            <ng-template #skeletonTable>
              <table class="min-w-full divide-y divide-gray-200 dark:divide-gray-600">
                <thead class="bg-gray-50 dark:bg-gray-700">
                  <tr>
                    <th class="p-4 text-xs font-medium text-left text-gray-500 uppercase dark:text-gray-400" *ngFor="let h of ['#','Nombre','Descripción','Fecha']">{{ h }}</th>
                  </tr>
                </thead>
                <tbody class="bg-white divide-y divide-gray-200 dark:bg-gray-800 dark:divide-gray-700">
                  <tr *ngFor="let i of [1,2,3,4]" class="animate-pulse">
                    <td class="p-4"><div class="h-4 bg-gray-200 rounded dark:bg-gray-700 w-6"></div></td>
                    <td class="p-4"><div class="h-4 bg-gray-200 rounded dark:bg-gray-700 w-32"></div></td>
                    <td class="p-4"><div class="h-4 bg-gray-200 rounded dark:bg-gray-700 w-48"></div></td>
                    <td class="p-4"><div class="h-4 bg-gray-200 rounded dark:bg-gray-700 w-24"></div></td>
                  </tr>
                </tbody>
              </table>
            </ng-template>

          </div>
        </div>
      </div>
    </div>

  </div>
</div>
