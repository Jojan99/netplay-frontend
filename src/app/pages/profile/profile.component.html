<div class="np-page np-profile">
  <header class="np-head">
    <div class="np-profile-id">
      <div class="np-avatar np-avatar--lg">{{ (profile?.username || 'U').charAt(0).toUpperCase() }}</div>
      <div>
        <p class="np-kicker">Cuenta <b>/</b> Mi perfil</p>
        <h1 class="np-title">{{ profile?.names || '…' }} {{ profile?.lastname || '' }}</h1>
        <div class="np-ribbon"><span class="np-mono">{{ '@' + (profile?.username || '') }}</span><span><span class="np-pill np-pill--neutral">{{ profile?.profile_name }}</span></span><span>{{ profile?.company_name }}</span></div>
      </div>
    </div>
  </header>

  <div class="np-scroll">
    <div class="np-grid-2 np-profile-grid">
      <section class="np-card">
        <div class="np-card-h"><h2>Información personal</h2></div>
        <div *ngIf="loading" class="np-loading np-loading--inline"><span class="np-spinner"></span> Cargando…</div>
        <div class="np-form" *ngIf="!loading">
          <label class="np-field"><span>Nombres</span><input class="np-input" [(ngModel)]="infoForm.names" type="text" /></label>
          <label class="np-field"><span>Apellidos</span><input class="np-input" [(ngModel)]="infoForm.lastname" type="text" /></label>
          <label class="np-field"><span>Correo electrónico</span><input class="np-input" [(ngModel)]="infoForm.email" type="email" /></label>
          <label class="np-field"><span>Teléfono</span><input class="np-input np-mono" [(ngModel)]="infoForm.phone" type="text" /></label>
          <label class="np-field"><span>Usuario</span><input class="np-input np-mono" [value]="profile?.username" disabled /></label>
          <label class="np-field"><span>Empresa</span><input class="np-input" [value]="profile?.company_name" disabled /></label>
          <div class="np-field-full np-btnrow np-btnrow--end"><button type="button" class="np-btn np-btn--primary" (click)="saveInfo()" [disabled]="saving"><span *ngIf="saving" class="np-spinner np-spinner--sm"></span>Guardar cambios</button></div>
        </div>
      </section>

      <section class="np-card">
        <div class="np-card-h"><h2>Cambiar contraseña</h2></div>
        <p *ngIf="pwError" class="np-notice np-notice--danger">{{ pwError }}</p>
        <div class="np-form np-form--single">
          <label class="np-field"><span>Contraseña actual</span>
            <span class="np-input-wrap"><input class="np-input" [(ngModel)]="pwForm.current_password" [type]="showCurrent ? 'text' : 'password'" autocomplete="current-password" /><button type="button" class="np-eye" (click)="showCurrent = !showCurrent" [attr.aria-label]="showCurrent ? 'Ocultar' : 'Mostrar'">{{ showCurrent ? 'Ocultar' : 'Ver' }}</button></span>
          </label>
          <label class="np-field"><span>Nueva contraseña</span>
            <span class="np-input-wrap"><input class="np-input" [(ngModel)]="pwForm.new_password" [type]="showNew ? 'text' : 'password'" autocomplete="new-password" /><button type="button" class="np-eye" (click)="showNew = !showNew">{{ showNew ? 'Ocultar' : 'Ver' }}</button></span>
          </label>
          <label class="np-field"><span>Confirmar nueva contraseña</span>
            <span class="np-input-wrap"><input class="np-input" [(ngModel)]="pwForm.new_password_confirmation" [type]="showConfirm ? 'text' : 'password'" autocomplete="new-password" /><button type="button" class="np-eye" (click)="showConfirm = !showConfirm">{{ showConfirm ? 'Ocultar' : 'Ver' }}</button></span>
          </label>
          <div class="np-btnrow np-btnrow--end"><button type="button" class="np-btn np-btn--primary" (click)="savePassword()" [disabled]="saving"><span *ngIf="saving" class="np-spinner np-spinner--sm"></span>Cambiar contraseña</button></div>
        </div>
      </section>
    </div>
  </div>
</div>
