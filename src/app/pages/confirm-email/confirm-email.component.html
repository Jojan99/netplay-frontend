<div class="np-console np-login np-confirm">
  <main class="np-login-main">
    <div class="np-login-card np-confirm-card">
      <span class="np-confirm-icon is-ok"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="m5 13 4 4L19 7"/></svg></span>
      <p class="np-kicker">Alta <b>/</b> Empresa</p>
      <h1 class="np-title np-login-title">Registro exitoso</h1>
      <p class="np-login-help">Tu empresa quedó registrada. Te enviamos un correo de confirmación: abrí el enlace para activar la cuenta antes de iniciar sesión.</p>
      <a routerLink="/login" class="np-btn np-btn--primary np-login-submit">Ir al inicio de sesión</a>
    </div>
  </main>
</div>
