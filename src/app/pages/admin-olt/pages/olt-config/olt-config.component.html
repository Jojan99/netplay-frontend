<div class="np-page np-olt">
  <header class="np-head">
    <div>
      <p class="np-kicker">Red <b>/</b> OLT <b>/</b> Configuración</p>
      <h1 class="np-title">Configuración de OLT</h1>
      <div class="np-ribbon"><span>Parámetros de conexión, valores por defecto para ONTs, bastión SSH y SNMP.</span></div>
    </div>
    <div class="np-actions">
      <label class="np-pagesize">OLT<select [(ngModel)]="selectedOltId" (ngModelChange)="onOltChange()" [disabled]="loadingOlts"><option [ngValue]="null">{{ loadingOlts ? 'Cargando…' : 'Seleccionar' }}</option><option *ngFor="let olt of olts" [ngValue]="olt.id">{{ olt.name }}</option></select></label>
      <button type="button" class="np-btn np-btn--primary" *ngIf="selectedOltId" (click)="saveForm()" [disabled]="saving || !form.name.trim() || !form.host.trim()"><span *ngIf="saving" class="np-spinner np-spinner--sm"></span>{{ saving ? 'Guardando…' : 'Guardar cambios' }}</button>
    </div>
  </header>
  <div class="np-toolbar"><app-olt-nav></app-olt-nav></div>
  <div class="np-scroll">
    <p class="np-empty-block" *ngIf="!selectedOltId && !loadingOlts"><strong>Elegí una OLT para editar su configuración.</strong></p>
    <div class="np-grid-2" *ngIf="selectedOltId">
      <section class="np-card">
        <div class="np-card-h"><h2>Conexión principal</h2></div>
        <div class="np-form">
          <label class="np-field"><span>Nombre <em>*</em></span><input class="np-input" [(ngModel)]="form.name" /></label>
          <label class="np-field"><span>Marca</span><select class="np-input" [(ngModel)]="form.brand"><option>Huawei</option><option>ZTE</option><option>Fiberhome</option></select></label>
          <label class="np-field"><span>Host / IP <em>*</em></span><input class="np-input np-mono" [(ngModel)]="form.host" /></label>
          <label class="np-field"><span>Puerto</span><input type="number" class="np-input np-mono" [(ngModel)]="form.port" /></label>
          <label class="np-field"><span>Usuario</span><input class="np-input np-mono" [(ngModel)]="form.username" /></label>
          <label class="np-field"><span>Modo de acceso</span><select class="np-input" [(ngModel)]="form.access_mode"><option value="telnet">Telnet</option><option value="ssh">SSH</option></select></label>
          <label class="np-field"><span>Nueva contraseña (vacío = sin cambio)</span><input type="password" class="np-input" [(ngModel)]="form.password" /></label>
          <label class="np-field"><span>Enable password</span><input type="password" class="np-input" [(ngModel)]="form.enable_password" /></label>
        </div>
      </section>
      <div class="np-form-col">
        <section class="np-card">
          <div class="np-card-h"><h2>Valores por defecto para ONTs</h2></div>
          <div class="np-form">
            <label class="np-field"><span>VLAN por defecto</span><input type="number" class="np-input np-mono" [(ngModel)]="form.default_vlan" placeholder="100" /></label>
            <label class="np-field"><span>Line profile ID</span><input type="number" class="np-input np-mono" [(ngModel)]="form.ont_lineprofile_id" placeholder="10" /></label>
            <label class="np-field"><span>Srv profile ID</span><input type="number" class="np-input np-mono" [(ngModel)]="form.ont_srvprofile_id" placeholder="10" /></label>
          </div>
        </section>
        <section class="np-card">
          <div class="np-card-h"><h2>Jump host (bastión SSH)</h2><button type="button" class="np-link" (click)="showAdvanced = !showAdvanced">{{ showAdvanced ? 'Ocultar' : 'Mostrar' }}</button></div>
          <div class="np-form" *ngIf="showAdvanced">
            <label class="np-field"><span>Jump host IP</span><input class="np-input np-mono" [(ngModel)]="form.jump_host" placeholder="10.0.0.1" /></label>
            <label class="np-field"><span>Puerto SSH</span><input type="number" class="np-input np-mono" [(ngModel)]="form.jump_port" /></label>
            <label class="np-field"><span>Usuario bastión</span><input class="np-input np-mono" [(ngModel)]="form.jump_user" /></label>
            <label class="np-field"><span>Contraseña bastión (vacío = sin cambio)</span><input type="password" class="np-input" [(ngModel)]="form.jump_pass" /></label>
          </div>
        </section>
        <section class="np-card">
          <div class="np-card-h"><h2>SNMP</h2><button type="button" class="np-link" (click)="showSnmp = !showSnmp">{{ showSnmp ? 'Ocultar' : 'Mostrar' }}</button></div>
          <div class="np-form" *ngIf="showSnmp">
            <label class="np-field"><span>SNMP host</span><input class="np-input np-mono" [(ngModel)]="form.snmp_host" placeholder="vacío = mismo host" /></label>
            <label class="np-field"><span>Community</span><input class="np-input np-mono" [(ngModel)]="form.snmp_community" /></label>
            <label class="np-field"><span>Versión</span><select class="np-input" [(ngModel)]="form.snmp_version"><option value="2c">2c</option><option value="1">1</option></select></label>
            <label class="np-field"><span>Puerto SNMP</span><input type="number" class="np-input np-mono" [(ngModel)]="form.snmp_port" /></label>
            <label class="np-field"><span>SNMP jump host</span><input class="np-input np-mono" [(ngModel)]="form.snmp_jump_host" /></label>
            <label class="np-field"><span>SNMP jump usuario</span><input class="np-input np-mono" [(ngModel)]="form.snmp_jump_user" /></label>
          </div>
        </section>
      </div>
    </div>
  </div>
</div>
