<div class="np-page np-hist">
  <header class="np-head">
    <div>
      <p class="np-kicker">Operación <b>/</b> Finanzas <b>/</b> Archivos de facturación</p>
      <h1 class="np-title">Archivos de facturación</h1>
      <div class="np-ribbon"><span><span class="np-n">{{ UserInterface.length }}</span>archivos generados</span></div>
    </div>
    <div class="np-actions">
      <button type="button" class="np-btn np-btn--primary" (click)="ejecutarComando()" [disabled]="procesando"><span *ngIf="procesando" class="np-spinner np-spinner--sm"></span>{{ procesando ? 'Procesando…' : 'Ejecutar facturación' }}</button>
    </div>
  </header>
  <div class="np-workspace">
    <section class="np-registry">
      <div class="np-registry-wrap">
        <table class="np-table np-table--registry">
          <thead><tr><th class="np-th-stripe"></th><th>Archivo</th><th class="np-th-right">Acción</th></tr></thead>
          <tbody>
            <tr *ngIf="UserInterface.length === 0" class="np-empty"><td colspan="3"><strong>No hay archivos generados.</strong></td></tr>
            <tr *ngFor="let file of UserInterface" class="np-row np-row--static">
              <td class="np-stripe"><i style="background:var(--accent)"></i></td>
              <td class="np-data np-strong">{{ file.names }}</td>
              <td class="np-td-right"><button type="button" class="np-btn np-btn--ghost np-btn--sm" (click)="downloadFiles(file.names)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12m0 0 4-4m-4 4-4-4M4 17v3h16v-3"/></svg>Descargar</button></td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>
  </div>
</div>
