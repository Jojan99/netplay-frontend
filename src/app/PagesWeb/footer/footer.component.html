<footer class="border-t border-stone-200 dark:border-stone-700/60 bg-white/80 dark:bg-stone-900/80 backdrop-blur-sm">
  <div class="max-w-screen-2xl mx-auto px-6 py-3">
    <div class="flex flex-col sm:flex-row items-center justify-between gap-3">

      <!-- Izquierda: branding -->
      <div class="flex items-center gap-3">
        <div class="w-7 h-7 rounded-lg bg-gradient-to-br from-indigo-500 to-indigo-700 flex items-center justify-center shadow-sm">
          <svg class="w-4 h-4 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M8.111 16.404a5.5 5.5 0 017.778 0M12 20h.01m-7.08-7.071c3.904-3.905 10.236-3.905 14.14 0M1.394 9.393c5.857-5.857 15.355-5.857 21.213 0"/>
          </svg>
        </div>
        <div class="flex items-baseline gap-1.5">
          <span class="text-sm font-bold bg-gradient-to-r from-indigo-600 to-indigo-400 bg-clip-text text-transparent">
            Netplay
          </span>
          <span class="text-xs text-stone-400 dark:text-stone-500 font-medium">ISP Manager</span>
        </div>
        <div class="hidden sm:block w-px h-4 bg-stone-200 dark:bg-stone-700 mx-1"></div>
        <span class="hidden sm:inline text-xs text-stone-400 dark:text-stone-500">
          © {{ year }} Todos los derechos reservados
        </span>
      </div>

      <!-- Centro: estado del sistema -->
      <div class="flex items-center gap-1.5 px-3 py-1 rounded-full bg-green-50 dark:bg-green-900/20 border border-green-100 dark:border-green-800/40">
        <span class="relative flex h-2 w-2">
          <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-green-400 opacity-75"></span>
          <span class="relative inline-flex rounded-full h-2 w-2 bg-green-500"></span>
        </span>
        <span class="text-xs font-medium text-green-700 dark:text-green-400">Todos los sistemas operativos</span>
      </div>

      <!-- Derecha: versión y crédito -->
      <div class="flex items-center gap-3 text-xs text-stone-400 dark:text-stone-500">
        <span class="sm:hidden">© {{ year }}</span>
        <div class="flex items-center gap-1">
          <svg class="w-3.5 h-3.5 text-stone-300 dark:text-stone-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4"/>
          </svg>
          <span class="font-mono">v2.0</span>
        </div>
        <div class="w-px h-3 bg-stone-200 dark:bg-stone-700"></div>
        <span class="flex items-center gap-1">
          Hecho con
          <svg class="w-3 h-3 text-red-400 fill-red-400" viewBox="0 0 20 20">
            <path d="M3.172 5.172a4 4 0 015.656 0L10 6.343l1.172-1.171a4 4 0 115.656 5.656L10 17.657l-6.828-6.829a4 4 0 010-5.656z"/>
          </svg>
          en Colombia
        </span>
      </div>

    </div>
  </div>
</footer>
