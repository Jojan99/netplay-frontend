<div class="pt-head">
  <div><a routerLink="/portal/reportes" class="pt-kicker" style="display:inline-flex;align-items:center;gap:4px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" style="width:14px;height:14px"><path d="m15 6-6 6 6 6"/></svg>Mis reportes</a><h1>Reporte <span class="np-mono">#{{ ticket()?.id }}</span></h1></div>
  <span class="pt-pill" *ngIf="ticket()" [ngClass]="ticket().status === 'Finalizado' ? 'is-ok' : ticket().status === 'En curso' ? 'is-warn' : 'is-info'" style="height:28px;font-size:13px">{{ ticket().status }}</span>
</div>

<div class="pt-skel" *ngIf="loading()"><span></span><span></span></div>
<div class="pt-alert pt-alert--danger" *ngIf="errorMsg()">{{ errorMsg() }}</div>

<div class="pt-grid pt-grid--2" *ngIf="!loading() && ticket()">
  <section class="pt-card">
    <div class="pt-card-h"><h2>{{ categoryLabel(ticket().category) }}</h2><small class="pt-fine">{{ formatDate(ticket().created_at) }}</small></div>
    <p style="margin:0;white-space:pre-wrap;line-height:1.6">{{ ticket().observation }}</p>
  </section>
  <section class="pt-card">
    <div class="pt-card-h"><h2>Seguimiento</h2></div>
    <ol class="pt-timeline">
      <li class="pt-tl" *ngFor="let item of timelineItems()" [class.is-done]="item.done" [class.is-active]="item.active">
        <span class="pt-tl-dot"><svg *ngIf="item.done" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><path d="m5 12 5 5L20 7"/></svg><svg *ngIf="!item.done" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="4"/></svg></span>
        <div><b>{{ item.label }}</b><small>{{ item.date ? formatDate(item.date) : 'Pendiente' }}</small></div>
      </li>
    </ol>
  </section>
</div>
