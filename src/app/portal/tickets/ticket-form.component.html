<div class="max-w-xl mx-auto">

  <div class="flex items-center gap-3 mb-6">
    <a routerLink="/portal/reportes"
       class="p-2 rounded-lg text-gray-500 hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
      </svg>
    </a>
    <div>
      <h2 class="text-2xl font-bold text-gray-900 dark:text-white">Reportar Falla</h2>
      <p class="text-sm text-gray-500 dark:text-gray-400">Cuéntanos qué está pasando con tu servicio</p>
    </div>
  </div>

  <!-- Éxito -->
  <div *ngIf="successMsg()"
       class="flex items-center gap-2 p-4 mb-6 text-sm font-medium text-green-800 bg-green-50
              dark:bg-green-900/20 dark:text-green-300 rounded-xl border border-green-200 dark:border-green-800">
    <svg class="w-5 h-5 flex-shrink-0" fill="currentColor" viewBox="0 0 20 20">
      <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/>
    </svg>
    {{ successMsg() }} — Redirigiendo...
  </div>

  <!-- Error -->
  <div *ngIf="errorMsg()"
       class="flex items-center gap-2 p-4 mb-6 text-sm text-red-800 bg-red-50
              dark:bg-red-900/20 dark:text-red-400 rounded-xl border border-red-200 dark:border-red-800">
    <svg class="w-4 h-4 flex-shrink-0" fill="currentColor" viewBox="0 0 20 20">
      <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd"/>
    </svg>
    {{ errorMsg() }}
  </div>

  <form (ngSubmit)="submit()" class="bg-white dark:bg-gray-800 rounded-2xl shadow-sm border border-gray-100 dark:border-gray-700 p-6 space-y-6">

    <!-- Tipo de problema -->
    <div>
      <label class="block text-sm font-semibold text-gray-900 dark:text-white mb-3">
        ¿Qué tipo de problema tienes?
      </label>
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
        <button *ngFor="let cat of categories" type="button"
                (click)="category = cat.value; errorMsg.set('')"
                [class]="category === cat.value
                  ? 'border-2 border-blue-500 bg-blue-50 dark:bg-blue-900/20 text-blue-700 dark:text-blue-300'
                  : 'border-2 border-gray-200 dark:border-gray-600 bg-gray-50 dark:bg-gray-700 text-gray-700 dark:text-gray-300 hover:border-blue-300 hover:bg-blue-50/50'"
                class="flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium transition-all text-left">
          <span class="text-xl">{{ cat.icon }}</span>
          <span>{{ cat.label }}</span>
        </button>
      </div>
    </div>

    <!-- Descripción -->
    <div>
      <label class="block text-sm font-semibold text-gray-900 dark:text-white mb-2">
        Describe el problema
        <span class="font-normal text-gray-400 ml-1">(mínimo 10 caracteres)</span>
      </label>
      <textarea [(ngModel)]="description" name="description" rows="4"
                placeholder="Ej: Desde las 3pm no tengo internet. Intenté reiniciar el router pero sigue sin funcionar..."
                class="w-full px-4 py-3 bg-gray-50 dark:bg-gray-700 border border-gray-300 dark:border-gray-600
                       text-gray-900 dark:text-white rounded-xl text-sm resize-none
                       focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent
                       placeholder-gray-400 dark:placeholder-gray-500"></textarea>
      <p class="text-xs text-gray-400 dark:text-gray-500 mt-1 text-right">
        {{ description.length }} / 1000 caracteres
      </p>
    </div>

    <!-- Botones -->
    <div class="flex gap-3 pt-2">
      <a routerLink="/portal/reportes"
         class="flex-1 text-center py-3 text-sm font-semibold text-gray-700 dark:text-gray-300
                bg-gray-100 dark:bg-gray-700 rounded-xl hover:bg-gray-200 dark:hover:bg-gray-600 transition-colors">
        Cancelar
      </a>
      <button type="submit" [disabled]="loading()"
              class="flex-1 flex items-center justify-center gap-2 py-3 text-sm font-semibold text-white
                     bg-blue-600 rounded-xl hover:bg-blue-700 focus:outline-none focus:ring-4 focus:ring-blue-300
                     dark:bg-blue-600 dark:hover:bg-blue-700 disabled:opacity-60 disabled:cursor-not-allowed transition-colors">
        <svg *ngIf="loading()" class="w-4 h-4 animate-spin" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/>
        </svg>
        {{ loading() ? 'Enviando...' : 'Enviar Reporte' }}
      </button>
    </div>

  </form>

</div>
